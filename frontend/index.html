<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>User Login</h2>

        <input 
            type="text" 
            id="username" 
            placeholder="Enter username"
        >

        <input 
            type="password" 
            id="password" 
            placeholder="Enter password"
        >

        <button onclick="loginUser()">Login</button>

        <p id="message"></p>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
